name: CI/CD-pipeline

on:
  push:
    branches: ["main"]

jobs:
  quality-check:
  # =========================================================================
  # JOB 1: CONTINUOUS INTEGRATION (QUALITY & TESTING)
  # =========================================================================    
    name: CI-Pipeline (Python ${{ matrix.python-version }})
    environment: ${{ github.ref_name }}
    runs-on: "ubuntu-latest"
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install via uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "python ${{ matrix.python-version }}"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Lint and Format Verification with Ruff
        run: |
          echo "Checking syntax error structures..."
          uv run ruff check .
          echo "Enforcing structural layout format checks..."
          uv run ruff format --check .

      - name: Test with pytest
        env:
          LLM_BASE_URL: "http://mock-cluster-address:4000/v1"
          LLM_API_KEY: "mock_ci_pipeline_secret_token"
          LLM_MODEL_NAME: "Hermes-4.3-36B"
          DEBUG_MODE: "True"
          PYTHONPATH: src
        run: |
          uv run pytest --maxfail=2 --disable-warnings
  # =========================================================================
  # JOB 2: CONTINUOUS DELIVERY (DOCKER COMPILATION VERIFICATION)
  # =========================================================================
  build-and-delivery:  # Warning: This job does not push the Docker image to a registry. It only verifies that the Dockerfile compiles successfully. You can add a separate job for pushing to a registry if needed.
    name: CD-Pipeline (Python ${{ matrix.python-version }})
    needs: quality-check  # CRITICAL: This job only triggers if all unit tests pass first!
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx to enable advanced caching features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Executes a test build of your Docker image to ensure the Dockerfile works
      - name: Build Local Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false # Set to false since we are only verifying compilation, not pushing to a remote registry yet
          tags: hermes-app:latest
          cache-from: type=gha  # Uses GitHub Actions native cache to make docker builds blazing fast
          cache-to: type=gha,mode=max
  