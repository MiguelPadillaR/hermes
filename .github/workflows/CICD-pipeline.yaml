name: CICD-pipeline


on:
    push:
        branches: ["main"]

jobs:
    quality-check:
        name: CI-Pipeline ${{ matrix.python-version }}
        environment: ${{ github.ref_name }}  # Branch name
        runs-on: ${{ fromJSON('["self-hosted", "prod"]') }}  # Explicitly set prod runner
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12"]
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
         
          - name: Instal via uv
            uses: astral-sh/setup-uv@v5
            with:
                enable-cache: true
                cache-suffix: "python ${{ matrix.python-version }}"

          - name: Set up Python ${{ matrix.python-version }}
            run: uv python install ${{ matrix.python-version }}
        
