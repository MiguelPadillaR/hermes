name: CI-pipeline

on:
  push:
    branches: ["main"]

jobs:
  quality-check:
    name: CI-Pipeline (Python ${{ matrix.python-version }})
    environment: ${{ github.ref_name }}
    runs-on: "ubuntu-latest"
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install via uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "python ${{ matrix.python-version }}"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Lint and Format Verification with Ruff
        run: |
          echo "Checking syntax error structures..."
          uv run ruff check .
          echo "Enforcing structural layout format checks..."
          uv run ruff format --check .

      - name: Test with pytest
        env:
          LLM_BASE_URL: "http://mock-cluster-address:4000/v1"
          LLM_API_KEY: "mock_ci_pipeline_secret_token"
          LLM_MODEL_NAME: "Hermes-4.3-36B"
          DEBUG_MODE: "True"
          PYTHONPATH: src
        run: |
          uv run pytest --maxfail=2 --disable-warnings
